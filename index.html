<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ticketrs | Control de Acceso</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #090d16;
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #f59e0b; }
    .badge { background: #1e293b; color: #38bdf8; font-size: 11px; padding: 4px 10px; border-radius: 99px; font-weight: 700; }
    
    .scanner-card {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #reader button {
      background: #f59e0b !important;
      color: #090d16 !important;
      border: none !important;
      padding: 10px 16px !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      margin: 8px 4px !important;
      font-size: 14px !important;
    }
    #reader select {
      background: #1e293b !important;
      color: #fff !important;
      border: 1px solid #475569 !important;
      padding: 8px !important;
      border-radius: 8px !important;
      margin-bottom: 8px !important;
    }

    .manual-box {
      width: 100%;
      max-width: 440px;
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    .manual-box input {
      flex: 1;
      background: #111827;
      border: 1px solid #334155;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      text-transform: uppercase;
      outline: none;
    }
    .manual-box input:focus { border-color: #f59e0b; }
    .manual-box button {
      background: #f59e0b;
      color: #090d16;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    #resultCard {
      width: 100%;
      max-width: 440px;
      margin-top: 16px;
      border-radius: 18px;
      padding: 18px;
      display: none;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .res-success { background: linear-gradient(135deg, #065f46, #047857); border: 2px solid #34d399; }
    .res-warning { background: linear-gradient(135deg, #92400e, #b45309); border: 2px solid #fbbf24; }
    .res-error   { background: linear-gradient(135deg, #991b1b, #b91c1c); border: 2px solid #f87171; }
    .res-loading { background: #1e293b; border: 1px solid #475569; text-align: center; }

    .res-title { font-size: 18px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .res-detail { font-size: 14px; line-height: 1.6; color: #f1f5f9; }
    
    .winner-banner {
      margin-top: 14px;
      background: #fef08a;
      color: #713f12;
      padding: 14px;
      border-radius: 12px;
      border: 2px dashed #ca8a04;
      text-align: center;
      animation: pulseGlow 1.2s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 8px rgba(250, 204, 21, 0.4); }
      to   { transform: scale(1.02); box-shadow: 0 0 20px rgba(250, 204, 21, 0.9); }
    }
    .winner-banner .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .winner-banner .prize { font-size: 19px; font-weight: 900; color: #090d16; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎟️ TICKETRS PUERTA</h1>
    <span class="badge">● EN VIVO</span>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div class="manual-box">
    <input type="text" id="manualId" placeholder="ID Manual (Ej: TKT-001)">
    <button onclick="verificarManual()">Validar</button>
  </div>

  <div id="resultCard"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyA_BRGOtqr0FgU0HHfRsQZSlVv1CuXo_musYF9j4tiPODbghIk9VdR6bo8nGohIYzo/exec";

    let bloqueado = false;

    function onScanSuccess(decodedText) {
      if (bloqueado) return;
      bloqueado = true;
      if (navigator.vibrate) navigator.vibrate(120);

      const ticketId = decodedText.split('|')[0].trim().toUpperCase();
      consultarTicket(ticketId);

      setTimeout(() => { bloqueado = false; }, 3000);
    }

    function verificarManual() {
      const input = document.getElementById('manualId');
      const id = input.value.trim().toUpperCase();
      if (!id) return;
      input.value = '';
      consultarTicket(id);
    }

    async function consultarTicket(ticketId) {
      const card = document.getElementById('resultCard');
      card.style.display = 'block';
      card.className = 'res-loading';
      card.innerHTML = `⏳ Validando <b>${ticketId}</b>...`;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify({ id: ticketId })
        });
        const data = await response.json();
        renderizarResultado(data);
      } catch (err) {
        card.className = 'res-error';
        card.innerHTML = `<div class="res-title">❌ ERROR DE RED</div><div class="res-detail">Verifica la conexión o la URL del script.</div>`;
      }
    }

    function renderizarResultado(res) {
      const card = document.getElementById('resultCard');
      card.style.display = 'block';

      if (res.status === 'success') card.className = 'res-success';
      else if (res.status === 'warning') card.className = 'res-warning';
      else card.className = 'res-error';

      let html = `<div class="res-title">${res.message} [${res.ticket}]</div>`;
      html += `<div class="res-detail">${res.detalle}</div>`;

      // Muestra el premio ÚNICAMENTE si posee uno asignado
      if (res.premio && res.premio.trim() !== "") {
        if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 300]);
        html += `
          <div class="winner-banner">
            <div class="label">🎁 ¡BOLETO PREMIADO! ENTREGAR:</div>
            <div class="prize">${res.premio}</div>
          </div>`;
      }

      card.innerHTML = html;
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 230, height: 230 } },
      onScanSuccess
    ).catch(() => {
      const fallbackScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 }, false);
      fallbackScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
